name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  backend:
    name: Backend (unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run unit tests
        working-directory: service
        run: mvn -B test

  frontend:
    name: Frontend (build web-ele)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          # 版本从 front/package.json 的 packageManager（pnpm@10.33.4）读取，避免与 engines 检查冲突
          package_json_file: front/package.json

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: front/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: front
        run: pnpm install --frozen-lockfile

      - name: Build web-ele
        working-directory: front
        run: pnpm --filter @vben/web-ele build

  build-images:
    # 测试全绿后才构建镜像；仅 push 到 gy / master 时发布（PR 不触发）
    name: Build & push images (GHCR)
    needs: [backend, frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/gy' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Backend image tags (latest + sha-<short>)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/silasbrooks/vben-admin-backend
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./service
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          build-args: |
            BASE_IMAGE_PREFIX=
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Frontend image tags (latest + sha-<short>)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/silasbrooks/vben-admin-frontend
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./front
          file: ./front/apps/web-ele/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            BASE_IMAGE_PREFIX=
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
