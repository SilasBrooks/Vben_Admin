# ---------------------------------------------------------------------------
# Docker 一键部署用 nginx 配置：静态托管前端产物 + /api 同源反代后端容器
# 与模板 scripts/deploy/nginx.conf 的差异：增加 /api 反代、上传体积、SSE 流式支持
# ---------------------------------------------------------------------------
worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include mime.types;
  default_type application/octet-stream;

  types {
    application/javascript js mjs;
    text/css css;
    text/html html;
  }

  sendfile on;
  keepalive_timeout 65;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json;
  gzip_min_length 1k;
  gzip_vary on;
  # 优先发送构建时预压缩的 .gz 产物（免实时压缩 CPU 开销）；无 .gz 的资源回落到动态 gzip
  gzip_static on;

  # WebSocket 升级头映射：普通请求空、升级请求 upgrade（站内通知 /api/ws/notice）
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
  }

  server {
    listen 8080;
    server_name localhost;

    # 上传接口单文件 10MB（后端限制）+ 表单开销余量
    client_max_body_size 15m;

    # AI 助手 SSE 流式：关闭代理缓冲，回复逐步可见
    location /api/ai/ {
      proxy_pass http://backend:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 300s;
    }

    # 业务接口同源反代（Cookie/Authorization 默认透传；含 WebSocket 升级头）
    location /api/ {
      proxy_pass http://backend:8080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 120s;
    }

    # SPA 静态资源 + 路由回退（hash 路由模式下回退兜底）
    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
      index index.html;
    }

    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
      root /usr/share/nginx/html;
    }
  }
}
