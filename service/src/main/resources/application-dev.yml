spring:
  data:
    # Redis：验证码/登录锁定/限流/token 版本号/在线会话的集中式存储（本地容器 vben-redis :6379）
    redis:
      host: 127.0.0.1
      port: 6379
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://127.0.0.1:5444/vben5
    username: postgres
    password: "123456"
  sql:
    init:
      # schema-postgres.sql 全部幂等（IF NOT EXISTS / CREATE OR REPLACE），可重复执行
      mode: always
      schema-locations: classpath:db/schema-postgres.sql
      data-locations: optional:classpath:db/data.sql
      # PG 会把小写标识符折叠，关闭种子初始化时的继续报错行为由应用自行处理
      continue-on-error: false

# DeepSeek 大模型（AI 智能助手）；api-key 仅存后端，通过 DEEPSEEK_API_KEY 环境变量注入（不在仓库中保存任何真实 Key）
deepseek:
  base-url: https://api.deepseek.com
  api-key: ${DEEPSEEK_API_KEY:}
  model: deepseek-chat
  timeout-seconds: 60
  max-tool-rounds: 3

# 开发联调：登录验证码接口回显明文（dev 专用，生产不开启）
vben:
  captcha:
    echo-enabled: true
