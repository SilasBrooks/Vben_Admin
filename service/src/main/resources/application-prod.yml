spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/vben_service?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ChangeMe
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  sql:
    init:
      # 首次部署建库后执行一次建表；正常启动请改为 never 或注释掉，避免重复初始化
      mode: never
      schema-locations: classpath:db/schema-mysql.sql

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

springdoc:
  # 生产环境关闭 API 文档（端点返回 404）
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

vben:
  jwt:
    access-token-secret: "${VBEN_JWT_ACCESS_SECRET}"
    refresh-token-secret: "${VBEN_JWT_REFRESH_SECRET}"
  cookie:
    # 生产环境（https 跨域部署）与前端约定一致
    same-site: None
    secure: true
