server:
  port: 8080
  # 与前端 vite proxy 约定一致：前端请求 /api/** 代理到本服务
  servlet:
    context-path: /api

spring:
  application:
    name: vben-service
  profiles:
    # 默认使用 dev(PostgreSQL, Docker 容器 vben5 :5444)；生产切换为 prod 并配置 MySQL
    active: dev
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      # 上传大小限制：单文件 10MB，单请求 15MB；业务层另有扩展名白名单与二次校验
      max-file-size: 10MB
      max-request-size: 15MB

mybatis-plus:
  configuration:
    # 控制台打印 SQL，生产请关闭
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

# ---------------------------------------------------------------------------
# JWT 双 Token 配置
# access  token：响应体返回，前端存 Pinia，请求头 Authorization: Bearer xxx
# refresh token：httpOnly Cookie（名称与前端约定为 jwt），仅 /api/auth/refresh 使用
# ---------------------------------------------------------------------------
vben:
  jwt:
    # 生产环境务必更换为足够随机的密钥（至少 32 字节），并保持 access/refresh 不同
    access-token-secret: "ChangeMe-Access-Token-Secret-Key-At-Least-32Bytes!"
    refresh-token-secret: "ChangeMe-Refresh-Token-Secret-Key-At-Least-32Bytes"
    access-token-validity: 7d
    refresh-token-validity: 30d
  cookie:
    # Cookie 名称与前端 backend-mock 约定保持一致
    name: jwt
    http-only: true
    max-age: 86400
    # 本地 http 开发环境必须为 Lax + false，否则浏览器拒收 Cookie 导致 refresh 失效；
    # 生产（https + 跨域部署）应为 None + true，与前端 mock 行为一致
    same-site: Lax
    secure: false
  cors:
    # 允许跨域携带 Cookie 的来源（走前端代理时无需跨域，此配置用于直连/分离部署）
    # 注意：同源部署（如 docker 前端 5888 经 nginx 反代）浏览器的 POST/PUT/PATCH/DELETE
    # 也会自动携带 Origin 头，后端 CORS 会按此白名单校验，故部署端口必须登记在此
    allowed-origins:
      - http://localhost:5777
      - http://localhost:5666
      - http://localhost:5888
  captcha:
    # 图形验证码有效期（秒）；echo-enabled 为开发联调回显开关，生产 profile 必须为 false
    ttl-seconds: 120
    echo-enabled: false
  file:
    # 存储实现：local（本地磁盘，默认）｜oss/minio（预留，暂未实现）
    storage: local
    local:
      # 本地存储根目录（相对服务运行目录），按 日期分桶/UUID.扩展名 组织
      base-path: ./files

springdoc:
  # API 文档：dev 打开（/api/v3/api-docs + /api/swagger-ui/index.html），prod profile 关闭
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    com.vben.service: debug
