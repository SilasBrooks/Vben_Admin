# 后端错误消息（默认/中文兜底）——英文见 messages_en_US.properties
# key 命名空间：error.<模块>.<语义>，占位符用 {0} {1}

# ============ 通用 ============
error.param.invalid=参数校验失败
error.server=服务器内部错误
error.request.malformed=请求体格式错误
error.upload.tooLarge=文件大小超过限制
error.ratelimit.exceeded=请求过于频繁，请稍后再试
error.idempotent.duplicate=请勿重复提交，请稍后再试
error.unauthorized=未登录或登录已过期
error.forbidden=无权访问
error.perm.denied=无权访问：缺少权限码 {0}

# ============ 认证/登录 ============
error.auth.captcha=验证码错误或已过期
error.auth.login.failed=用户名或密码错误
error.auth.user.missing=用户不存在或已停用
error.auth.oldPassword=旧密码不正确
error.auth.password.tooShort=新密码至少 6 位
error.login.credentials.blank=用户名和密码不能为空
error.login.captcha.blank=验证码不能为空
error.login.locked={0}登录失败次数过多，已临时锁定，请约 {1} 分钟后再试
error.login.lockTarget.user=该账号
error.login.lockTarget.ip=该 IP

# ============ 用户 ============
error.user.notFound=用户不存在
error.user.username.blank=用户名不能为空
error.user.password.blank=初始密码不能为空
error.user.username.exists=用户名已存在
error.user.delete.self=不能删除当前登录用户
error.user.lastSuper=不能移除/停用系统最后一个 super 用户
error.user.dept.notFound=所选部门不存在
error.user.dept.disabled=所选部门已停用
error.user.email.invalid=邮箱格式不正确

# ============ 角色 ============
error.role.notFound=角色不存在
error.role.superKeyFixed=super 角色标识不可修改
error.role.superCannotDisable=super 角色不可停用
error.role.superCannotDelete=super 角色不可删除
error.role.inUse=角色已分配给用户，无法删除
error.role.dataScope.invalid=数据范围取值非法
error.role.dataScope.superFixed=super 角色数据范围恒为全部数据
error.role.dataScope.deptRequired=自定义部门范围至少选择一个部门

# ============ 菜单 ============
error.menu.notFound=菜单不存在
error.menu.parent.self=父级菜单不能选择自身
error.menu.hasChildren=存在子菜单，无法删除

# ============ 部门 ============
error.dept.name.blank=部门名称不能为空
error.dept.parent.notFound=父部门不存在
error.dept.parent.disabledAdd=父部门已停用，不能在其下新增
