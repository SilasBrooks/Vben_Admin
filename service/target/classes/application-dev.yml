spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://127.0.0.1:5444/vben5
    username: postgres
    password: "123456"
  sql:
    init:
      # schema-postgres.sql 全部幂等（IF NOT EXISTS / CREATE OR REPLACE），可重复执行
      mode: always
      schema-locations: classpath:db/schema-postgres.sql
      data-locations: optional:classpath:db/data.sql
      # PG 会把小写标识符折叠，关闭种子初始化时的继续报错行为由应用自行处理
      continue-on-error: false

# DeepSeek 大模型（AI 智能助手）；api-key 仅存后端，生产用 DEEPSEEK_API_KEY 环境变量注入
deepseek:
  base-url: https://api.deepseek.com
  api-key: ${DEEPSEEK_API_KEY:sk-8921d783b2e04d398e5a21a0410115eb}
  model: deepseek-chat
  timeout-seconds: 60
  max-tool-rounds: 3
